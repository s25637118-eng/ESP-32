<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 雙軸向量迷宮系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root {
            --primary-cyan: #00f2ff;
            --secondary-purple: #bc13fe;
            --matrix-green: #00ff41;
            --bg-dark: #07080b;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            width: 100%; height: 100%;
            background: linear-gradient(rgba(0, 242, 255, 0.02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 242, 255, 0.02) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: -1;
        }

        .game-container {
            background: rgba(20, 25, 40, 0.85);
            border: 1px solid rgba(0, 242, 255, 0.3);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.15);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        h1 {
            font-size: 22px;
            letter-spacing: 2px;
            color: var(--primary-cyan);
            text-shadow: 0 0 10px var(--primary-cyan);
            margin: 0 0 15px 0;
        }

        #gameCanvas {
            background: #11141d;
            border: 2px solid #222831;
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .control-panel {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .btn-row {
            display: flex;
            gap: 15px;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--primary-cyan);
            color: var(--primary-cyan);
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .btn.purple {
            border-color: var(--secondary-purple);
            color: var(--secondary-purple);
        }

        .btn:shadow-active, .btn:active {
            background: var(--primary-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 15px var(--primary-cyan);
        }

        .btn.purple:active {
            background: var(--secondary-purple);
            color: white;
            box-shadow: 0 0 15px var(--secondary-purple);
        }

        .status-text {
            font-family: monospace;
            color: var(--matrix-green);
            text-shadow: 0 0 5px var(--matrix-green);
            font-size: 13px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 15px;
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 65, 0.2);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>DUAL-AXIS VECTOR MAZE</h1>
        
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="control-panel">
            <div class="btn-row">
                <button class="btn" 
                        onmousedown="sendVector('A', 'ON')" onmouseup="sendVector('A', 'OFF')"
                        ontouchstart="sendVector('A', 'ON')" ontouchend="sendVector('A', 'OFF')">
                    推進器 A (按住⬆️ / 放開➡️)
                </button>
                <button class="btn purple" 
                        onmousedown="sendVector('B', 'ON')" onmouseup="sendVector('B', 'OFF')"
                        ontouchstart="sendVector('B', 'ON')" ontouchend="sendVector('B', 'OFF')">
                    推進器 B (按住⬅️ / 放開⬇️)
                </button>
            </div>
            <div class="status-text" id="sysLog">Vector A: OFF (➡️) | Vector B: OFF (⬇️)</div>
        </div>
    </div>

    <script>
        // --- MQTT 設定 ---
        const broker = "broker.emqx.io";
        const port = 8084;
        const clientId = "cyber_maze_v2_" + Math.random().toString(16).substr(2, 8);
        
        // 使用兩個不同主題來區分兩個按鈕/LED
        const topicA = "myhome/esp32/ledA";
        const topicB = "myhome/esp32/ledB";

        const client = new Paho.MQTT.Client(broker, port, clientId);
        
        let stateA = "OFF"; // ON=上, OFF=右
        let stateB = "OFF"; // ON=左, OFF=下
        let activeThruster = "A"; // 當前主要驅動的推進器 ('A' 或 'B')

        client.onMessageArrived = (msg) => {
            if (msg.destinationName === topicA) stateA = msg.payloadString;
            if (msg.destinationName === topicB) stateB = msg.payloadString;
            updateLogDisplay();
        };

        client.connect({ useSSL: true, timeout: 3, onSuccess: () => {
            client.subscribe(topicA);
            client.subscribe(topicB);
        }});

        function sendVector(thruster, state) {
            activeThruster = thruster; // 切換最後操作的推進器
            if (thruster === 'A') stateA = state;
            if (thruster === 'B') stateB = state;
            
            updateLogDisplay();

            if (client.isConnected()) {
                const message = new Paho.MQTT.Message(state);
                message.destinationName = (thruster === 'A') ? topicA : topicB;
                client.send(message);
            }
        }

        function updateLogDisplay() {
            const dirA = stateA === 'ON' ? '⬆️' : '➡️';
            const dirB = stateB === 'ON' ? '⬅️' : '⬇️';
            document.getElementById("sysLog").innerText = `A: ${stateA} (${dirA}) | B: ${stateB} (${dirB}) | ACTIVE: ${activeThruster}`;
        }

        // --- 遊戲邏輯引擎 ---
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // 玩家初始位置（放在中央偏下，方便四向移動測試）
        let player = { x: 50, y: 320, size: 12, speed: 1.5 };
        const goal = { x: 350, y: 50, size: 15 };

        // 重新設計一個適合四向移動的迷宮地圖 [x, y, width, height]
        const walls = [
            [0, 0, 400, 15], [0, 385, 400, 15], [0, 0, 15, 400], [385, 0, 15, 400], // 外牆
            [0, 260, 280, 20],
            [120, 140, 280, 20],
            [120, 140, 20, 120],
            [250, 0, 20, 80]
        ];

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.w &&
                   rect1.x + rect1.size > rect2.x &&
                   rect1.y < rect2.y + rect2.h &&
                   rect1.y + rect1.size > rect2.y;
        }

        function gameLoop() {
            let nextPos = { ...player };

            // 根據「最後操作或啟用的推進器」來決定目前的移動向量
            if (activeThruster === 'A') {
                if (stateA === "ON") nextPos.y -= player.speed;  // A 亮：上
                else                 nextPos.x += player.speed;  // A 滅：右
            } else if (activeThruster === 'B') {
                if (stateB === "ON") nextPos.x -= player.speed;  // B 亮：左
                else                 nextPos.y += player.speed;  // B 滅：下 (後)
            }

            // 碰撞檢查
            let hitWall = false;
            for (let wall of walls) {
                if (checkCollision(nextPos, { x: wall[0], y: wall[1], w: wall[2], h: wall[3] })) {
                    hitWall = true;
                    break;
                }
            }

            if (!hitWall) {
                player.x = nextPos.x;
                player.y = nextPos.y;
            }

            // 勝利檢查
            const distToGoal = Math.hypot(player.x - goal.x, player.y - goal.y);
            if (distToGoal < 20) {
                alert("✦ CORE SYSTEM LINKED! 系統導航成功 ✦");
                player.x = 50; player.y
