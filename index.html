<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 雙軸向量迷宮系統 - 實驗地圖版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root {
            --primary-cyan: #00f2ff;
            --secondary-purple: #bc13fe;
            --matrix-green: #00ff41;
            --bg-dark: #07080b;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            width: 100%; height: 100%;
            background: linear-gradient(rgba(0, 242, 255, 0.02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 242, 255, 0.02) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: -1;
        }

        .game-container {
            background: rgba(20, 25, 40, 0.85);
            border: 1px solid rgba(0, 242, 255, 0.3);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.15);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        h1 {
            font-size: 22px;
            letter-spacing: 2px;
            color: var(--primary-cyan);
            text-shadow: 0 0 10px var(--primary-cyan);
            margin: 0 0 15px 0;
        }

        #gameCanvas {
            background: #11141d;
            border: 2px solid #222831;
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .control-panel {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .btn-row {
            display: flex;
            gap: 15px;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--primary-cyan);
            color: var(--primary-cyan);
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 160px;
        }

        .btn.purple {
            border-color: var(--secondary-purple);
            color: var(--secondary-purple);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .light-indicator {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            color: #aaa;
        }

        .btn.active-light .light-indicator {
            background: var(--matrix-green);
            color: black;
            box-shadow: 0 0 8px var(--matrix-green);
            font-weight: bold;
        }

        .status-text {
            font-family: monospace;
            color: var(--matrix-green);
            text-shadow: 0 0 5px var(--matrix-green);
            font-size: 13px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 15px;
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 65, 0.2);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>VECTOR NAVIGATION LAB v2.0</h1>
        
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="control-panel">
            <div class="btn-row">
                <button id="btnA" class="btn" onclick="toggleVector('A')">
                    <span>推進器 A (開關)</span>
                    <span class="light-indicator" id="lightA">LED: OFF (➡️)</span>
                </button>
                <button id="btnB" class="btn purple" onclick="toggleVector('B')">
                    <span>推進器 B (開關)</span>
                    <span class="light-indicator" id="lightB">LED: OFF (⬇️)</span>
                </button>
            </div>
            <div class="status-text" id="sysLog">A: OFF (➡️) | B: OFF (⬇️) | ACTIVE: A</div>
        </div>
    </div>

    <script>
        // --- MQTT 設定 ---
        const broker = "broker.emqx.io";
        const port = 8084;
        const clientId = "cyber_maze_lab_" + Math.random().toString(16).substr(2, 8);
        
        const topicA = "myhome/esp32/ledA";
        const topicB = "myhome/esp32/ledB";

        const client = new Paho.MQTT.Client(broker, port, clientId);
        
        let stateA = "OFF"; 
        let stateB = "OFF"; 
        let activeThruster = "A"; 

        client.onMessageArrived = (msg) => {
            if (msg.destinationName === topicA) {
                stateA = msg.payloadString;
                activeThruster = "A";
            }
            if (msg.destinationName === topicB) {
                stateB = msg.payloadString;
                activeThruster = "B";
            }
            updateUI();
        };

        client.connect({ useSSL: true, timeout: 3, onSuccess: () => {
            client.subscribe(topicA);
            client.subscribe(topicB);
        }});

        function toggleVector(thruster) {
            activeThruster = thruster;
            let targetTopic = "";
            let newState = "";

            if (thruster === 'A') {
                stateA = (stateA === "OFF") ? "ON" : "OFF";
                newState = stateA;
                targetTopic = topicA;
            } else {
                stateB = (stateB === "OFF") ? "ON" : "OFF";
                newState = stateB;
                targetTopic = topicB;
            }
            
            updateUI();

            if (client.isConnected()) {
                const message = new Paho.MQTT.Message(newState);
                message.destinationName = targetTopic;
                client.send(message);
            }
        }
